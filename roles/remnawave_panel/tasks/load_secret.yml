---
- name: Check persisted {{ remnawave_secret.name }}
  ansible.builtin.stat:
    path: "{{ remnawave_panel_secrets_dir }}/{{ remnawave_secret.name }}"
  register: remnawave_secret_file
  no_log: true

- name: Generate {{ remnawave_secret.name }}
  ansible.builtin.command:
    argv:
      - openssl
      - rand
      - -hex
      - "{{ remnawave_secret.bytes | string }}"
  register: remnawave_generated_secret
  changed_when: true
  when:
    - remnawave_secret.override | length == 0
    - not remnawave_secret_file.stat.exists
  no_log: true

- name: Persist {{ remnawave_secret.name }}
  ansible.builtin.copy:
    content: "{{ remnawave_generated_secret.stdout }}\n"
    dest: "{{ remnawave_panel_secrets_dir }}/{{ remnawave_secret.name }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - remnawave_secret.override | length == 0
    - not remnawave_secret_file.stat.exists
  no_log: true

- name: Read persisted {{ remnawave_secret.name }}
  ansible.builtin.slurp:
    src: "{{ remnawave_panel_secrets_dir }}/{{ remnawave_secret.name }}"
  register: remnawave_persisted_secret
  when: remnawave_secret.override | length == 0
  no_log: true

- name: Resolve {{ remnawave_secret.name }}
  ansible.builtin.set_fact:
    "{{ remnawave_secret.fact }}": >-
      {{
        remnawave_secret.override
        if remnawave_secret.override | length > 0
        else (remnawave_persisted_secret.content | b64decode | trim)
      }}
  no_log: true
