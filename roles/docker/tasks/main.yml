---
- name: Validate Docker host operating system
  ansible.builtin.assert:
    that:
      - ansible_distribution in docker_supported_distributions
      - ansible_architecture in docker_arch_map
    fail_msg: >-
      Docker role supports Ubuntu/Debian on these architectures:
      {{ docker_arch_map.keys() | join(', ') }}.

- name: Ensure APT keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Install required system packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_apt_repository_url }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  become: true

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc] {{ docker_apt_repository_url }} {{ ansible_distribution_release }} stable"
    filename: docker
    state: present
  become: true

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Ensure Docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  become: true
