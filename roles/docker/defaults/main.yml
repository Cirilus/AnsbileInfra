---
docker_arch_map:
  x86_64: amd64
  aarch64: arm64
  armv7l: armhf
  ppc64le: ppc64el

docker_apt_arch: "{{ docker_arch_map.get(ansible_architecture, ansible_architecture) }}"
docker_supported_distributions:
  - Ubuntu
  - Debian
docker_distribution_slug: "{{ ansible_distribution | lower }}"
docker_apt_repository_url: "https://download.docker.com/linux/{{ docker_distribution_slug }}"
