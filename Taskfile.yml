version: '3'

tasks:
  default:
    desc: Run the default Ansible playbook
    cmds:
      - task: run

  run:
    desc: Run init_server.yml, optionally with TAGS=<tag1,tag2>
    vars:
      PLAYBOOK: '{{.PLAYBOOK | default "init_server.yml"}}'
      TAGS: '{{.TAGS | default ""}}'
    cmds:
      - cmd: >-
          if [ -n "{{.TAGS}}" ]; then
            ansible-playbook {{.PLAYBOOK}} --tags "{{.TAGS}}";
          else
            ansible-playbook {{.PLAYBOOK}};
          fi

  sni:
    desc: Run only the sni_finder role
    cmds:
      - task: run
        vars:
          TAGS: sni_finder

  remnawave-control:
    desc: Deploy the Remnawave control plane
    vars:
      INVENTORY: '{{.INVENTORY | default "inventory/remnawave.yml"}}'
    cmds:
      - ansible-playbook -i "{{.INVENTORY}}" remnawave.yml --limit remnawave_control

  remnawave-nodes:
    desc: Deploy all Remnawave data plane nodes
    vars:
      INVENTORY: '{{.INVENTORY | default "inventory/remnawave.yml"}}'
    cmds:
      - ansible-playbook -i "{{.INVENTORY}}" remnawave.yml --limit remnawave_nodes

  new:
    desc: Create a new Ansible role with ansible-galaxy role init name=<role_name>
    preconditions:
      - sh: test -n "{{.name}}"
        msg: Pass the role name via task new name=<role_name>
    cmds:
      - cmd: ansible-galaxy role init "{{.name}}"
        dir: /Users/kirillskolenko/Work/pet-projects/AnsbileInfra/roles
